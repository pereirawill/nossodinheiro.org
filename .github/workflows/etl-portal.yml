name: ETL Portal da Transparência — emendas e Poderes

on:
  schedule:
    - cron: "23 6 * * 2"        # terça 03:23 BRT (janela 00h–06h = limite maior da API)
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano de referência"
        default: "2025"
      etapa:
        description: "inspect (só mostra campos) | poderes | emendas | emendas-documentos (horas)"
        default: "inspect"

permissions:
  contents: write

concurrency:
  group: etl-portal
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANO: ${{ github.event.inputs.ano || '2025' }}
      ETAPA: ${{ github.event.inputs.etapa || 'poderes' }}
      PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Chave presente?
        run: test -n "$PORTAL_TRANSPARENCIA_KEY" || { echo "::error::secret PORTAL_TRANSPARENCIA_KEY ausente"; exit 1; }

      - name: Inspecionar campos reais da API
        if: env.ETAPA == 'inspect'
        run: |
          python -m etl.portal_transparencia.extract_emendas inspect --ano "$ANO"
          python - <<'EOF'
          import os, httpx, json
          c = httpx.Client(base_url="https://api.portaldatransparencia.gov.br/api-de-dados",
                           headers={"chave-api-dados": os.environ["PORTAL_TRANSPARENCIA_KEY"], "accept": "application/json"}, timeout=60)
          r = c.get("/despesas/por-orgao", params={"ano": os.environ["ANO"], "pagina": 1})
          print("/despesas/por-orgao HTTP", r.status_code, "itens:", len(r.json()) if r.status_code == 200 else r.text[:300])
          if r.status_code == 200 and r.json():
              print("campos:", sorted(r.json()[0].keys())); print(json.dumps(r.json()[0], ensure_ascii=False, indent=2))
          EOF

      - name: Poderes (despesa por órgão)
        if: env.ETAPA == 'poderes'
        run: |
          python -m etl.portal_transparencia.extract_poderes --ano "$ANO"
          python -m etl.portal_transparencia.transform_poderes --ano "$ANO" --populacao 212600000

      - name: Emendas (lista)
        if: env.ETAPA == 'emendas' || env.ETAPA == 'emendas-documentos'
        run: |
          python -m etl.portal_transparencia.extract_emendas emendas --ano "$ANO"
          test -f data/parquet/deputados.parquet || python -m etl.camara.extract deputados && python -m etl.camara.transform --ano 2026 --fonte bulk || true
          python -m etl.portal_transparencia.transform_emendas --ano "$ANO"

      - name: Emendas (documentos — para onde foi)
        if: env.ETAPA == 'emendas-documentos'
        run: |
          python -m etl.portal_transparencia.extract_emendas documentos --ano "$ANO" --rpm 500
          python -m etl.portal_transparencia.transform_emendas --ano "$ANO"

      - name: Commitar dados agregados
        if: env.ETAPA != 'inspect'
        run: |
          mkdir -p site/public/data && cp data/public/*.json site/public/data/ 2>/dev/null || true
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: portal-transparencia $ETAPA $ANO ($(date -u +%F))"
          git pull --rebase origin main && git push
