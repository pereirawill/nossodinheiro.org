name: ETL STF — custo por ministro

# O portal do STF (egesp-portal.stf.jus.br) responde 403 aos runners do GitHub (IPs fora do Brasil),
# com qualquer user-agent (testado em 26/10/2026). Por isso NÃO há agendamento: a atualização mensal é
# `make stf ANO=2026` numa máquina no Brasil + commit de data/public e site/public/data. O dispatch manual
# fica para testar se o bloqueio mudou.
on:
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano de referência"
        default: "2026"

permissions:
  contents: write

concurrency:
  group: etl-stf
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANO: ${{ github.event.inputs.ano || '2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Extrair folha (ministros + gabinetes, CSV do Portal da Transparência do STF)
        run: python -m etl.stf.extract folha --ano "$ANO"

      - name: Transformar
        run: |
          python -m etl.stf.transform --ano "$ANO"
          mkdir -p site/public/data && cp data/public/custo_ministro_stf_*.json data/public/meta_stf_*.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: stf custo-ministro $ANO ($(date -u +%F))"
          git pull --rebase origin main && git push
