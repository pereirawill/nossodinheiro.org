name: ETL STF — custo por ministro

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-stf.yml", "etl/stf/**"]
  schedule:
    - cron: "17 10 * * 2"       # terça 07:17 BRT (a folha do mês anterior costuma sair na 1ª quinzena)
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano de referência"
        default: "2026"

permissions:
  contents: write

concurrency:
  group: etl-stf
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANO: ${{ github.event.inputs.ano || '2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Extrair folha (ministros + gabinetes, CSV do Portal da Transparência do STF)
        run: python -m etl.stf.extract folha --ano "$ANO"

      - name: Transformar
        run: |
          python -m etl.stf.transform --ano "$ANO"
          mkdir -p site/public/data && cp data/public/custo_ministro_stf_*.json data/public/meta_stf_*.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: stf custo-ministro $ANO ($(date -u +%F))"
          git pull --rebase origin main && git push
