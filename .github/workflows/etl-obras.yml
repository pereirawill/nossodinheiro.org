name: ETL Obras — cadastro federal de investimentos (Obrasgov/CIPI)

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-obras.yml", "etl/obras/**", "etl/ufs.py"]
  schedule:
    - cron: "17 16 15 * *"     # dia 15 de cada mês, 13:17 BRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-obras
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    # a API do Obrasgov leva ~85 s por requisição e devolve no máximo 50 registros: são ~1.000 chamadas
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: "Extrair (Obrasgov: projetos de investimento e execução financeira) — sem chave"
        run: |
          python -m etl.obras.extract
          mkdir -p site/public/data && cp data/public/obras.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: obras ($(date -u +%F))"
          git pull --rebase origin main && git push
