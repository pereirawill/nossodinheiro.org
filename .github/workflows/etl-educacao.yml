name: ETL Educação — IDEB (INEP)

# O INEP (download.inep.gov.br) recusa conexões vindas dos runners do GitHub ("connection reset by peer"), como o STF.
# Por isso não há agenda: rodar localmente `python -m etl.educacao.extract` quando o INEP publicar uma edição (bienal)
# e commitar data/public/educacao.json + site/public/data/educacao.json. O dispatch fica para testar se o bloqueio caiu.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-educacao
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Extrair (INEP, planilhas do IDEB) — sem chave
        run: |
          python -m etl.educacao.extract
          mkdir -p site/public/data && cp data/public/educacao.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: educação ($(date -u +%F))"
          git pull --rebase origin main && git push
