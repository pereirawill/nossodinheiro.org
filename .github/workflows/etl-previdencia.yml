name: ETL Previdência — INSS por benefício e por estado (BEPS)

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-previdencia.yml", "etl/previdencia/**", "etl/ufs.py"]
  schedule:
    - cron: "17 15 14 * *"     # dia 14 de cada mês, 12:17 BRT (o boletim sai com ~2 meses de defasagem)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-previdencia
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: "Extrair (Boletim Estatístico da Previdência Social: abas 13, 15 e 19) — sem chave"
        run: |
          python -m etl.previdencia.extract
          mkdir -p site/public/data && cp data/public/previdencia.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: previdência ($(date -u +%F))"
          git pull --rebase origin main && git push
