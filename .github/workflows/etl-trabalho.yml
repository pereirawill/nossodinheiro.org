name: ETL Trabalho — PNAD, empresas e INSS

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-trabalho.yml", "etl/trabalho/**"]
  schedule:
    - cron: "57 10 5 * *"       # dia 5 de cada mês, 07:57 BRT (PNAD trimestral, Mapa de Empresas e BEPS mensais)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-trabalho
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Extrair (IBGE SIDRA, Mapa de Empresas, BEPS) — sem chave
        run: |
          python -m etl.trabalho.extract
          mkdir -p site/public/data && cp data/public/trabalho.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: trabalho ($(date -u +%F))"
          git pull --rebase origin main && git push
