name: ETL Câmara — custo por deputado

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl.yml", "etl/**"]
  schedule:
    - cron: "17 9 * * 1"        # segunda-feira 06:17 BRT
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano de referência"
        default: "2026"
      fonte:
        description: "bulk (CSV anual, padrão) ou api (endpoint /despesas — instável)"
        default: "bulk"

permissions:
  contents: write

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANO: ${{ github.event.inputs.ano || '2026' }}
      FONTE: ${{ github.event.inputs.fonte || 'bulk' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Extrair
        run: |
          python -m etl.camara.extract deputados
          if [ "$FONTE" = "bulk" ]; then
            python -m etl.camara.extract ceap-bulk --ano "$ANO"
          else
            python -m etl.camara.extract despesas --ano "$ANO"
          fi

      - name: Diagnóstico do raw
        run: |
          ls -la data/raw/
          for f in data/raw/*.jsonl.gz; do echo "== $f: $(zcat $f | wc -l) linhas"; zcat $f | head -c 600; echo; done

      - name: Transformar + gráfico
        run: |
          python -m etl.camara.transform --ano "$ANO" --fonte "$FONTE"
          python -m etl.camara.chart --ano "$ANO" --top 20 --por deputado
          python -m etl.camara.chart --ano "$ANO" --top 20 --por partido
          cp data/public/*.json site/public/data/

      - name: Publicar Parquet como artefato (não vai pro git)
        uses: actions/upload-artifact@v4
        with:
          name: parquet-${{ env.ANO }}
          path: data/parquet/
          retention-days: 30

      # Só o JSON agregado (pequeno) é versionado; raw e parquet ficam fora do git.
      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"
          git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: câmara custo-deputado $ANO ($(date -u +%F))"
          git push
