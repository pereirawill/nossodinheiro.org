name: ETL Inflação — IPCA (IBGE) e meta (Banco Central)

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-inflacao.yml", "etl/inflacao/**"]
  schedule:
    - cron: "17 14 12 * *"     # dia 12 de cada mês, 11:17 BRT (o IBGE divulga o IPCA entre os dias 8 e 10)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-inflacao
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: "Extrair (IBGE SIDRA: IPCA e INPC; Banco Central: meta) — sem chave"
        run: |
          python -m etl.inflacao.extract
          mkdir -p site/public/data && cp data/public/inflacao.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: inflação ($(date -u +%F))"
          git pull --rebase origin main && git push
