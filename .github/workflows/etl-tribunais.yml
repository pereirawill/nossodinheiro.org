name: ETL Tribunais — folha de magistrados e gabinetes (STJ, TST, STM, TRF4, TRF6)

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-tribunais.yml", "etl/tribunais/**"]
  schedule:
    - cron: "27 14 24 * *"     # dia 24 de cada mês, 11:27 BRT (o STJ publica o mês anterior depois do dia 21)
  workflow_dispatch:
    inputs:
      ano:
        description: "ano-calendário"
        required: false
        default: "2026"

permissions:
  contents: write

concurrency:
  group: etl-tribunais
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: "Extrair e transformar a folha de cada tribunal (STJ, TST, STM, TRF4, TRF6) — sem chave"
        env:
          ANO: ${{ github.event.inputs.ano || '2026' }}
        run: |
          mkdir -p site/public/data
          falhas=0
          for t in stj tst stm trf6 trf4; do
            # Os portais dos tribunais podem recusar IPs fora do Brasil (o do STF recusa). Um tribunal que falhar
            # não derruba os outros: o painel dele apenas fica com o dado do mês anterior, já commitado.
            if python -m etl.tribunais.extract --tribunal "$t" --ano "$ANO" && \
               python -m etl.tribunais.transform --tribunal "$t" --ano "$ANO"; then
              echo "::notice::$t atualizado"
            else
              echo "::warning::$t falhou — portal fora do ar, formato novo ou IP bloqueado"
              falhas=$((falhas+1))
            fi
          done
          cp data/public/custo_magistrado_*.json data/public/meta_st*.json site/public/data/ || true
          if [ "$falhas" = "5" ]; then echo "todos os tribunais falharam"; exit 1; fi

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: tribunais superiores ($(date -u +%F))"
          git pull --rebase origin main && git push
