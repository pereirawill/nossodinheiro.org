name: ETL Municípios — Câmaras Municipais e estados

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-municipios.yml", "etl/municipios/**"]
  schedule:
    - cron: "17 9 2 5,8,11 *"   # dia 2 de maio, agosto e novembro, 06:17 BRT (DCA do ano anterior chega até abril; retardatários depois)
  workflow_dispatch:
    inputs:
      ano:
        description: "Exercício da DCA"
        default: "2025"
      vagas:
        description: "Ano da eleição municipal (vagas de vereador)"
        default: "2024"

permissions:
  contents: write

concurrency:
  group: etl-municipios
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANO: ${{ github.event.inputs.ano || '2025' }}
      VAGAS: ${{ github.event.inputs.vagas || '2024' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Extrair (SICONFI: entes + DCA de 5.597 entes; TSE: vagas) — sem chave
        run: |
          python -m etl.municipios.extract entes
          python -m etl.municipios.extract vagas --ano "$VAGAS"
          python -m etl.municipios.extract dca --ano "$ANO" --workers 2

      - name: Transformar
        run: |
          python -m etl.municipios.transform --ano "$ANO" --vagas "$VAGAS"
          mkdir -p site/public/data && cp data/public/municipios_*.json data/public/estados_*.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: municípios/estados DCA $ANO ($(date -u +%F))"
          git pull --rebase origin main && git push
