name: ETL Bancos — lucro dos bancos (BC IF.data) com conferência na CVM

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-bancos.yml", "etl/bancos/**"]
  schedule:
    - cron: "52 9 21 * *"      # dia 21 de cada mês, 06:52 BRT (o IF.data sai ~2 meses depois do trimestre)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-bancos
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    # 4 trimestres × 27 anos de IF.data, mais o cadastro de cada período e um ZIP de DFP da CVM
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: "Extrair (Banco Central IF.data + CVM + IPCA) — sem chave"
        run: |
          python -m etl.bancos.extract
          mkdir -p site/public/data && cp data/public/bancos.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: bancos ($(date -u +%F))"
          git pull --rebase origin main && git push
