name: ETL Histórico — séries longas (SIOP, Receita, INSS, IPCA)

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-historico.yml", "etl/historico/**"]
  schedule:
    - cron: "37 11 6 * *"       # dia 6 de cada mês, 08:37 BRT (depois dos ETLs de impostos e trabalho)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-historico
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Extrair (SIOP por ano, IPCA, BEPS; receita vem de impostos.json) — sem chave
        run: |
          python -m etl.historico.extract
          mkdir -p site/public/data && cp data/public/historico.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: histórico ($(date -u +%F))"
          git pull --rebase origin main && git push
