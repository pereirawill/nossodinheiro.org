name: ETL Imposto de Renda — Grandes Números do IRPF (Receita Federal)

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-irpf.yml", "etl/irpf/**"]
  schedule:
    - cron: "17 13 8 4,5 *"     # 8 de abril e 8 de maio, 10:17 BRT — a Receita publica a edição nova em março/abril
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-irpf
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: "Extrair (Receita Federal: Grandes Números do IRPF, planilha de ~20 MB) — sem chave"
        run: |
          python -m etl.irpf.extract
          mkdir -p site/public/data && cp data/public/irpf.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: imposto de renda ($(date -u +%F))"
          git pull --rebase origin main && git push
