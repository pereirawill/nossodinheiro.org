name: ETL Senado — custo por senador

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-senado.yml", "etl/senado/**"]
  schedule:
    - cron: "47 9 * * *"        # todo dia 06:47 BRT (depois do ETL da Câmara)
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano de referência"
        default: "2026"

permissions:
  contents: write

concurrency:
  group: etl-senado
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANO: ${{ github.event.inputs.ano || '2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Extrair (lista de senadores + recursos utilizados, sem chave)
        run: |
          python -m etl.senado.extract senadores
          python -m etl.senado.extract recursos --ano "$ANO"

      - name: Transformar
        run: |
          python -m etl.senado.transform --ano "$ANO"
          mkdir -p site/public/data && cp data/public/custo_senador_*.json data/public/meta_senado_*.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: senado custo-senador $ANO ($(date -u +%F))"
          git pull --rebase origin main && git push
