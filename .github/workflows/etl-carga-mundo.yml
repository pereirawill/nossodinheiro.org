name: ETL Carga no mundo — receita tributária por país (OCDE)

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-carga-mundo.yml", "etl/carga_mundo/**"]
  schedule:
    - cron: "33 12 19 * *"     # dia 19 de cada mês, 09:33 BRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-carga-mundo
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: "Extrair (OCDE, Global Revenue Statistics, API SDMX) — sem chave"
        run: |
          python -m etl.carga_mundo.extract
          mkdir -p site/public/data && cp data/public/carga_mundo.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: carga tributária no mundo ($(date -u +%F))"
          git pull --rebase origin main && git push
