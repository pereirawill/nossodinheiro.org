name: ETL Economia — PIB, Selic e contas do governo

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-economia.yml", "etl/economia/**"]
  schedule:
    - cron: "41 11 4 * *"      # dia 4 de cada mês, 08:41 BRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-economia
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: "Extrair (IBGE Contas Nacionais, BCB SGS 432, Tesouro RTN) — sem chave"
        run: |
          python -m etl.economia.extract
          mkdir -p site/public/data && cp data/public/economia.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: economia ($(date -u +%F))"
          git pull --rebase origin main && git push
