name: ETL Renda — PNAD Contínua (IBGE)

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-renda.yml", "etl/renda/**", "etl/ufs.py"]
  schedule:
    - cron: "17 11 7 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-renda
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Extrair (IBGE SIDRA) — sem chave
        run: |
          python -m etl.renda.extract
          mkdir -p site/public/data && cp data/public/renda.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: renda ($(date -u +%F))"
          git pull --rebase origin main && git push
