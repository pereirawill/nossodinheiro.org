name: ETL Indústria — participação, produção física e pauta de exportação

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-industria.yml", "etl/industria/**"]
  schedule:
    - cron: "27 12 17 * *"     # dia 17 de cada mês, 09:27 BRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-industria
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: "Extrair (Banco Mundial WDI e IBGE PIM-PF) — sem chave"
        run: |
          python -m etl.industria.extract
          mkdir -p site/public/data && cp data/public/industria.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: indústria ($(date -u +%F))"
          git pull --rebase origin main && git push
