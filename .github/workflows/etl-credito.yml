name: ETL Inadimplência — SCR.data (Banco Central)

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-credito.yml", "etl/credito/**", "etl/ufs.py"]
  schedule:
    - cron: "47 12 10 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-credito
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Extrair (Banco Central SCR.data, zips anuais) — sem chave
        run: |
          python -m etl.credito.extract
          mkdir -p site/public/data && cp data/public/credito.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: inadimplência ($(date -u +%F))"
          git pull --rebase origin main && git push
