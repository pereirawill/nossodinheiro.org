name: ETL Câmbio — real frente a outras moedas (Banco Central)

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-cambio.yml", "etl/cambio/**"]
  schedule:
    - cron: "40 17 * * 1-5"    # dias úteis, 14:40 BRT (depois do fechamento do PTAX, ~13:10)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-cambio
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: "Extrair (Banco Central: SGS e PTAX) — sem chave"
        run: |
          python -m etl.cambio.extract
          mkdir -p site/public/data && cp data/public/cambio.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: câmbio ($(date -u +%F))"
          git pull --rebase origin main && git push
