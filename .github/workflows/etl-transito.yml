name: ETL Trânsito — mortes no trânsito (IBGE/SIM)

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-transito.yml", "etl/transito/**", "etl/ufs.py"]
  schedule:
    - cron: "19 10 9 * *"      # dia 9 de cada mês, 07:19 BRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-transito
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: "Extrair (IBGE/SIDRA tabela 4408, indicador ODS 3.6.1) — sem chave"
        run: |
          python -m etl.transito.extract
          mkdir -p site/public/data && cp data/public/transito.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: trânsito ($(date -u +%F))"
          git pull --rebase origin main && git push
