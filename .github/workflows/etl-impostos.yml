name: ETL Impostos — arrecadação federal

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-impostos.yml", "etl/impostos/**"]
  schedule:
    - cron: "27 10 25 * *"      # dia 25 de cada mês, 07:27 BRT (a Receita publica o mês anterior por volta do dia 20)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-impostos
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Extrair (CSV da Receita Federal, sem chave)
        run: |
          python -m etl.impostos.extract
          mkdir -p site/public/data && cp data/public/impostos.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: impostos ($(date -u +%F))"
          git pull --rebase origin main && git push
