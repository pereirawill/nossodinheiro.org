name: ETL Rankings — posição do Brasil

on:
  push:
    branches: [main]
    paths: [".github/workflows/etl-rankings.yml", "etl/rankings/**"]
  schedule:
    - cron: "37 9 1 * *"        # dia 1 de cada mês, 06:37 BRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl-rankings
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Extrair (Banco Mundial, PNUD, Transparência Internacional, IBGE — sem chave)
        run: |
          python -m etl.rankings.extract
          mkdir -p site/public/data && cp data/public/rankings.json site/public/data/

      - name: Commitar dados agregados
        run: |
          git config user.name "etl-bot"; git config user.email "etl-bot@users.noreply.github.com"
          git add data/public site/public/data
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "data: rankings ($(date -u +%F))"
          git pull --rebase origin main && git push
