name: Deploy site — Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_run:                      # dispara após o ETL commitar dados novos
    workflows: ["ETL Câmara — custo por deputado", "ETL Portal da Transparência — emendas e Poderes", "ETL Senado — custo por senador", "ETL STF — custo por ministro", "ETL Rankings — posição do Brasil", "ETL Presidência — cartão corporativo", "ETL Impostos — arrecadação federal", "ETL Municípios — Câmaras Municipais e estados", "ETL Trabalho — PNAD, empresas e INSS", "ETL Histórico — séries longas (SIOP, Receita, INSS, IPCA)", "ETL Renda — PNAD Contínua (IBGE)", "ETL Educação — IDEB (INEP)", "ETL Segurança — Sinesp VDE (MJSP)", "ETL Inadimplência — SCR.data (Banco Central)", "ETL Saúde — planos (ANS) e indicadores (IBGE)", "ETL Inflação — IPCA (IBGE) e meta (Banco Central)", "ETL Punições — CEIS, CNEP, CEAF e leniência (Portal da Transparência)", "ETL Previdência — INSS por benefício e por estado (BEPS)", "ETL Obras — cadastro federal de investimentos (Obrasgov/CIPI)", "ETL Câmbio — real frente a outras moedas (Banco Central)", "ETL Imposto de Renda — Grandes Números do IRPF (Receita Federal)", "ETL Tribunais — folha de magistrados e gabinetes (STJ, TST, STM, TRF4, TRF6)", "ETL Estatais — lucro das estatais (CVM, SEST) e dividendos da União (Tesouro)", "ETL Saneamento — água, esgoto e lixo (IBGE)", "ETL Dívida — juros nominais e estoque da DPF (Tesouro)", "ETL Trânsito — mortes no trânsito (IBGE/SIM)", "ETL Desenvolvimento — educação e homicídios por estado (IBGE)", "ETL Economia — PIB, Selic e contas do governo", "ETL Preços — combustível em tempo de trabalho e nível de preços", "ETL Indústria — participação, produção física e pauta de exportação", "ETL Carga no mundo — receita tributária por país (OCDE)", "ETL Bancos — lucro dos bancos (BC IF.data) com conferência na CVM"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: false   # um deploy 'skipped' (ETL que falhou) não pode cancelar um deploy real em andamento

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # após workflow_run, garante o commit mais novo (com os JSONs)

      - name: Dados presentes?
        run: |
          test -f site/public/data/custo_deputado_2026.json || {
            echo "::error::site/public/data/*.json ausente — rode o workflow 'ETL Câmara' primeiro"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci || npm install
        working-directory: site

      - run: npm run build
        working-directory: site

      - name: Banco do painel "Agora" (D1) — opcional, não derruba o deploy
        id: d1
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # O painel /agora/ é a única parte do site que precisa de banco. Se o token não tiver permissão de D1,
          # este passo falha, o deploy segue sem o binding e a página mostra "indisponível".
          lista() { npx --yes wrangler@4 d1 list --json 2>/dev/null; }
          id=$(lista | jq -r '.[]? | select(.name=="nossodinheiro-agora") | .uuid' | head -1)
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            npx --yes wrangler@4 d1 create nossodinheiro-agora
            id=$(lista | jq -r '.[]? | select(.name=="nossodinheiro-agora") | .uuid' | head -1)
          fi
          test -n "$id" && test "$id" != "null" || { echo "::warning::D1 indisponível para este token"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          npx --yes wrangler@4 d1 execute nossodinheiro-agora --remote --file=db/agora.sql -y

      - name: Publicar no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ steps.d1.outputs.id }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::secret CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::secret CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }
          if [ -n "$D1_ID" ]; then
            printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "nossodinheiro-agora"\ndatabase_id = "%s"\n' "$D1_ID" >> wrangler.toml
            echo "painel Agora com banco $D1_ID"
          else
            echo "::warning::deploy sem o banco do painel Agora (o resto do site não depende dele)"
          fi
          npx --yes wrangler@4 whoami
          npx --yes wrangler@4 pages project list | grep -q '^│ nossodinheiro ' \
            || npx --yes wrangler@4 pages project create nossodinheiro --production-branch=main
          npx --yes wrangler@4 pages deploy --project-name=nossodinheiro --branch=main --commit-dirty=true
