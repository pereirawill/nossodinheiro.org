name: Deploy site — Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_run:                      # dispara após o ETL commitar dados novos
    workflows: ["ETL Câmara — custo por deputado", "ETL Portal da Transparência — emendas e Poderes", "ETL Senado — custo por senador", "ETL STF — custo por ministro", "ETL Rankings — posição do Brasil", "ETL Presidência — cartão corporativo", "ETL Impostos — arrecadação federal", "ETL Municípios — Câmaras Municipais e estados", "ETL Trabalho — PNAD, empresas e INSS", "ETL Histórico — séries longas (SIOP, Receita, INSS, IPCA)", "ETL Renda — PNAD Contínua (IBGE)", "ETL Educação — IDEB (INEP)", "ETL Segurança — Sinesp VDE (MJSP)", "ETL Inadimplência — SCR.data (Banco Central)", "ETL Saúde — planos (ANS) e indicadores (IBGE)", "ETL Inflação — IPCA (IBGE) e meta (Banco Central)", "ETL Punições — CEIS, CNEP, CEAF e leniência (Portal da Transparência)", "ETL Previdência — INSS por benefício e por estado (BEPS)", "ETL Obras — cadastro federal de investimentos (Obrasgov/CIPI)", "ETL Câmbio — real frente a outras moedas (Banco Central)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: false   # um deploy 'skipped' (ETL que falhou) não pode cancelar um deploy real em andamento

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # após workflow_run, garante o commit mais novo (com os JSONs)

      - name: Dados presentes?
        run: |
          test -f site/public/data/custo_deputado_2026.json || {
            echo "::error::site/public/data/*.json ausente — rode o workflow 'ETL Câmara' primeiro"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci || npm install
        working-directory: site

      - run: npm run build
        working-directory: site

      - name: Publicar no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::secret CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::secret CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }
          npx --yes wrangler@4 whoami
          npx --yes wrangler@4 pages project list | grep -q '^│ nossodinheiro ' \
            || npx --yes wrangler@4 pages project create nossodinheiro --production-branch=main
          npx --yes wrangler@4 pages deploy site/dist --project-name=nossodinheiro --branch=main --commit-dirty=true
